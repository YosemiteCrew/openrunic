# GitGuardian secret-detection policy.
#
# EXCEPTION PROCESS, the same one .grant.yaml and .github/zizmor.yml follow:
# every entry below MUST name what was verified, why the value is not a secret,
# and the condition under which the entry should be deleted. An allowlist that
# accumulates entries without reasons is worse than no scanner, because it reads
# like diligence while doing nothing.
#
# Ignore a MATCH, never a path. Path-ignoring a file means a real credential
# pasted into that file later goes unreported, and the one file we would be
# tempted to ignore here is a test about credential handling: exactly where a
# real one is most likely to be pasted by accident.
version: 2

secret:
  ignored-matches:
    # Two canaries in packages/adapters/src/registry.test.ts, at the top of a
    # suite named "call records never carry a payload". The test drives
    # obviously sensitive values through three partner seams and then asserts
    # that none of them appears anywhere in the emitted call records, which is
    # how the adapter layer proves it does not log payloads.
    #
    # The values are invented, and the file says so on the line above them:
    # "Values chosen to be unmistakable if they ever appear in a log. All
    # invented." Their whole design is to look like a credential, because a
    # canary that looked innocuous would not prove anything when it leaked.
    # GitGuardian's Generic High Entropy Secret detector reads that shape and
    # reports it, which is the detector working rather than failing.
    #
    # Verified: neither value exists in any deployment, any environment file, or
    # any partner account. They are string literals in a test fixture and are
    # referenced nowhere else in the repository.
    #
    # Revisit: delete an entry if its literal ever stops appearing in that test,
    # and never extend this list to a value that is used outside a test.
    - name: 'adapters redaction test: card token canary'
      match: 'tok-DO-NOT-LOG-9911'
    - name: 'adapters redaction test: consent reference canary'
      match: 'consent-DO-NOT-LOG-4471'
