name: Bug report
description: Report something that is broken or behaving incorrectly
title: '[Bug]: '
labels: ['bug']
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      description: Please confirm before submitting.
      options:
        - label: I searched existing issues and this has not been reported yet
          required: true
        - label: >-
            I have not included any real patient data (PHI/PII) in this report, its screenshots,
            or its logs. All example data is synthetic.
          required: true
        - label: This is not a security vulnerability (those go through the Security tab, not issues)
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of openrunic is affected?
      options:
        - web
        - api
        - database
        - fhir
        - docs/other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one-or-two-sentence description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal, numbered steps. Use synthetic data in any example records.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, pnpm version, browser (if web), commit or branch.
      placeholder: |
        OS: macOS 15.5
        Node: 22.x
        pnpm: 10.x
        Browser: Firefox 141
        Commit/branch: dev @ abc1234
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: >-
        REDACT before pasting: remove tokens, connection strings, and anything resembling patient
        data. Logs are rendered as code automatically.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Your assessment of the impact.
      options:
        - 'Critical: data loss, data corruption, or completely blocked workflow'
        - 'High: major feature broken with no workaround'
        - 'Medium: feature broken but a workaround exists'
        - 'Low: minor issue or cosmetic'
    validations:
      required: true
