name: Setup pnpm + Node
description: >
  Shared toolchain setup for all workspaces: pnpm, Node, the pnpm content-addressable
  store cache, and (optionally) a frozen install. Centralised so caching stays
  consistent across workflows instead of being copy-pasted into every job.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '22'
  install:
    description: Run `pnpm install --frozen-lockfile` as part of setup.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      # No version input: pnpm/action-setup reads the pinned version from the
      # root package.json `packageManager` field, so the CI toolchain can never
      # drift from the repository's.
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        run_install: false

    # No `cache: pnpm` here. setup-node's built-in cache and the explicit
    # actions/cache block below both cache the pnpm store, so enabling both
    # would make every job save and restore the same directory twice.
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Resolve pnpm store path
      id: store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ inputs.node-version }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
