name: CI

# Orchestrator for the single-run pipeline. Every stage is a reusable workflow
# called from here, so all of them execute inside this one Actions run and hand
# artifacts and outputs to each other by ordinary same-run means: no
# workflow_run, no download-by-run-id, no PAT.
#
# This is the primary CI. The `CI Required` aggregate below is the one check
# marked required on the branch rulesets - the comment on that job records when
# that happened and how to read its absence on a pull request.

on:
  pull_request: {}
  push:
    branches: [main, dev]
  merge_group: {}
  workflow_dispatch:
    inputs:
      force_push_base:
        description: Base SHA override, for re-running after a force push.
        required: false
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    uses: ./.github/workflows/_core.yaml
    with:
      force_push_base: ${{ inputs.force_push_base }}

  repo:
    # Repo-wide gates: formatting, stylesheets, workflow YAML, shell scripts and
    # Dockerfiles. Deliberately not `needs: core` and deliberately unconditional.
    # Every other stage hangs off the affected-workspace matrix, which is empty
    # for a change confined to docs, workflows or scripts - exactly the changes
    # these gates exist to catch. Gating this on `has-any` would reintroduce the
    # hole it closes.
    permissions:
      contents: read
    uses: ./.github/workflows/_repo.yaml

  test:
    needs: core
    if: needs.core.outputs.has-any == 'true'
    uses: ./.github/workflows/_test.yaml
    with:
      matrix: ${{ needs.core.outputs.matrix }}

  agent-disabled:
    name: Agent disabled
    needs: core
    if: needs.core.outputs.has-any == 'true'
    # ADR-0005 makes the agent-disabled configuration a first-class CI target
    # rather than an afterthought. The whole suite runs with every assistant
    # variable explicitly blank, asserting that the product is complete with no
    # model configured. If any clinical workflow degrades without one, we have
    # shipped the dependency we said we would not ship; we would just have
    # moved it over a socket.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENRUNIC_AGENT_BASE_URL: ''
      OPENRUNIC_AGENT_MODEL: ''
      OPENRUNIC_AGENT_API_KEY: ''
      OPENRUNIC_AGENT_PROVIDER: ''
      OPENRUNIC_AGENT_PHI_EGRESS: ''
      OPENRUNIC_AGENT_APPROVAL_SECRET: ''
      OPENRUNIC_AGENT_API_BASE_URL: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate Prisma client
        run: pnpm --filter @openrunic/database exec prisma generate

      - name: Run the whole suite with no model configured
        run: pnpm turbo run test

  migration:
    needs: core
    # The database workspace, because it carries schema.prisma and
    # prisma/migrations and no other workspace can change what
    # `prisma migrate deploy` does.
    #
    # AND `api`, which is newer and is about the OTHER thing this stage owns:
    # it is the only stage with a Postgres, so it is the only place the API's
    # `DATABASE_URL`-gated suites can run at all. Those suites had never run in
    # CI - `describe.skipIf` makes a failing case indistinguishable from an
    # absent one, and `repositories.database.test.ts` was red on `dev` at
    # c12b5a8 with nobody able to see it. Gating this stage on the database
    # workspace alone would have kept it that way: the defect they guard
    # (#399, a per-tenant audit chain racing itself under concurrency) lives in
    # `apps/api`, so an `apps/api` change has to be able to fire them.
    #
    # Matched on `"workspace":"api"` rather than on `api`, because the matrix
    # JSON also carries `"dir":"apps/api"` and a bare substring would be true
    # for reasons that have nothing to do with which workspace was affected.
    if: >
      needs.core.outputs.has-any == 'true' &&
      (contains(needs.core.outputs.matrix, '@openrunic/database') ||
       contains(needs.core.outputs.matrix, '"workspace":"api"'))
    uses: ./.github/workflows/_migration.yaml

  # Runs the artefacts an operator runs: the migration-safety linter, the
  # full-day clinical drill, a timed `docker compose up`, and a real
  # backup-and-restore. Gated on the same affected check as the rest of the
  # pipeline so a docs-only pull request does not spend forty minutes booting
  # containers, and independent of `test` because none of its legs consumes the
  # coverage artifact.
  #
  # These are the slowest legs in the pipeline by a wide margin. That is the
  # trade being made deliberately: the claims they check - install in under
  # thirty minutes, restore in under fifteen, a clinic can get through a day -
  # are ones a clinic finds out about at the worst possible time if CI does not.
  ops:
    needs: core
    if: needs.core.outputs.has-any == 'true'
    uses: ./.github/workflows/_ops.yaml

  sonar:
    needs: [core, test]
    # Gated on the test stage's own output rather than on the affected booleans,
    # so this can never ask for a coverage artifact that was not produced.
    # vars.DISABLE_SONAR is a kill switch that works on every trigger, unlike a
    # workflow_dispatch input, which is null on pull_request and would silently
    # skip the stage on exactly the events that matter most. It is currently
    # unset, so the stage runs; the aggregate below counts a skipped stage as a
    # pass, which is exactly what makes setting it a decision rather than a
    # convenience. Adding an app to the stage takes three things: a SonarCloud
    # project, a sonar-project.properties in the app directory, and a
    # SONAR_TOKEN_* secret wired through the secrets block below.
    #
    # Dependabot PRs run with the Dependabot secret store, which does not carry
    # the SONAR_TOKEN* values, so the scan can only fail with "Not authorized".
    # Skip Sonar for them (the roll-up below counts a skipped stage as a pass);
    # every dependency change is re-scanned by the push-to-main analysis once it
    # is promoted.
    #
    # Sonar can only publish from a pull_request event (PR analysis) or from
    # main (the SonarCloud plan accepts analysis of each project's MAIN BRANCH
    # only). Any other ref - a dev push, a workflow_dispatch from dev, a merge
    # queue's ephemeral ref - can never publish anywhere and every leg fails
    # with "Not authorized or project not found" at the quality-gate check, so
    # those runs skip the stage. PR analysis carries the gate; the push-to-main
    # scan keeps the dashboard current. Name every SonarCloud project's main
    # branch `main` - a project whose main branch is named `dev` fails on main
    # pushes and passes on dev pushes, the mirror image of the others.
    if: >
      vars.DISABLE_SONAR != 'true' &&
      needs.test.outputs.apps-with-coverage != '' &&
      needs.test.outputs.apps-with-coverage != '[]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    # SonarCloud decorates PRs through its GitHub App; the scan job consumes no
    # GITHUB_TOKEN, so the call site grants nothing beyond read.
    permissions:
      contents: read
    uses: ./.github/workflows/_sonar.yaml
    with:
      apps-with-coverage: ${{ needs.test.outputs.apps-with-coverage }}
    # Only the Sonar tokens, never `secrets: inherit`, which would put the whole
    # organisation and repository secret store in scope for a workflow whose
    # scan step selects its token dynamically.
    secrets:
      SONAR_TOKEN_WEB: ${{ secrets.SONAR_TOKEN_WEB }}
      SONAR_TOKEN_API: ${{ secrets.SONAR_TOKEN_API }}
      SONAR_TOKEN_PORTAL: ${{ secrets.SONAR_TOKEN_PORTAL }}

  ci-required:
    name: CI Required
    # The one check marked required on BOTH branch rulesets. It was published
    # first so its behaviour could be observed before that happened - the
    # switchover has since been made, and this comment went on describing it as
    # pending until 2026-09-06.
    #
    # What each ruleset requires ALONGSIDE it is deliberately not listed here.
    # An earlier version of this comment enumerated it and was wrong within
    # three hours: `dev` gained a required context on 2026-09-06 and nothing in
    # this file can notice when that happens. Read the rulesets.
    #
    # Which matters for how a reader treats its absence: a pull request with no
    # `CI Required` row is a check that has not reported yet, not a check nobody
    # is enforcing.
    if: always()
    needs: [core, repo, test, agent-disabled, migration, ops, sonar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate stage results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          # `skipped` passes: a packages-only change legitimately skips test's
          # coverage set, migration only runs for database changes, and sonar
          # is skipped while DISABLE_SONAR is set. `cancelled` fails: an
          # aggregate built on !cancelled() lets a cancelled dependency through
          # as a pass.
          #
          # Because `skipped` passes, a stage that can skip is a stage that can
          # go quiet. The `repo` stage above is therefore unconditional: it has
          # no `if:` and none of its jobs do either, so its only outcomes are
          # success, failure and cancellation. Do not add a condition to it
          # without first deciding what a skip would be permitting.
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "CI Required: at least one stage failed or was cancelled"
            exit 1
          fi
          echo "CI Required: ok"
