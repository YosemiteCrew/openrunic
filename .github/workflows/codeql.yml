name: 'CodeQL Advanced'

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '21 10 * * 5'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # THIS WORKFLOW IS COUPLED TO A REQUIRED STATUS CHECK THAT IT DOES NOT NAME.
  # ---------------------------------------------------------------------------
  # `CodeQL` is a required context on the `dev` ruleset. No job here produces
  # that name - the matrix produces `Analyze (actions)` and
  # `Analyze (javascript-typescript)`, and `CodeQL` is the code scanning
  # aggregate the Advanced Security app posts once an analysis uploads.
  #
  # So the required context is downstream of this file with nothing recording
  # the link. Adding a `paths:`/`paths-ignore:` filter to the `on:` block above,
  # or an `if:` to the job below, stops the upload on the filtered shapes; the
  # aggregate then never posts, and a context that never posts blocks forever.
  # One line here deadlocks every pull request into `dev`.
  #
  # The mirror hazard is the one in forbidden-terms.yml: a `skipped` conclusion
  # SATISFIES a required check, so a condition that makes a gate skip is a gate
  # that passes hardest where it did not run. Neither failure is visible from
  # this file alone. Change the `on:` block or add a job condition only together
  # with the ruleset entry.
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # required to upload the analysis to code scanning
      packages: read # required to fetch internal or private CodeQL packs
      actions: read # only required for workflows in private repositories
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads the tree, so the default GITHUB_TOKEN must not be
          # left behind in .git/config where a later step or action could read it.
          persist-credentials: false

      # No dependency install needed: both languages use build-mode "none",
      # which extracts the CodeQL database directly from source.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:${{matrix.language}}'
