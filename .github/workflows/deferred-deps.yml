name: Deferred dependencies

# Answers the revisit conditions in .github/dependabot.yml, instead of leaving
# them to be answered by nobody.
#
# Several majors are held back there, each with a reason and a "revisit when
# ..." note. Those notes are the honest way to carry a blocked upgrade, and they
# are also how a repository quietly stops upgrading: the blocker gets fixed
# upstream, nobody re-reads the note, and a temporary hold becomes permanent.
#
# So this tries them. Monthly, it installs the newest version of each held
# package and runs the gate that failed, then writes what it found into one
# tracking issue. It opens no pull request and changes no ignore entry: a green
# result is evidence that an upgrade is worth attempting, not permission to take
# it unread.

on:
  schedule:
    # Monthly. These are majors: they do not appear weekly, and a job that
    # re-runs the whole suite five times over deserves a cadence that matches
    # how often the answer can actually change.
    - cron: '41 4 1 * *'
  workflow_dispatch:

concurrency:
  group: deferred-deps
  cancel-in-progress: true

permissions: {}

# WHY THIS IS TWO JOBS.
#
# The first one installs `@latest` of packages this repository has deliberately
# not adopted and then runs lint, tests and type-check over them. Every one of
# those is arbitrary code from a package chosen for being NEW: install scripts,
# plugin entry points, transitive dependencies nobody has reviewed. Testing an
# unadopted major is exactly the act of running code you do not trust, and that
# is fine - it is what the job is for.
#
# What must not also be true is that the same job holds a credential. It used to:
# the reporting step ran in the same job with `issues: write` and `GH_TOKEN`, one
# step after the untrusted install. A step does not need to be handed a secret to
# reach one that arrives later in its job - appending to `GITHUB_ENV` or
# `GITHUB_PATH` is enough to have a subsequent shell step source an attacker's
# script or resolve a planted `gh`. And the retry script deliberately swallows
# failures so the report always gets written, so a package that broke on purpose
# would not even stop the credentialed step from running.
#
# So the untrusted half runs with `permissions: {}` and no token and hands its
# result over as an artifact, and the half that writes to the tracking issue
# checks out nothing, installs nothing and runs only `gh`. Neither job can be
# both.
jobs:
  retry:
    name: Retry deferred majors
    runs-on: ubuntu-latest
    # Five gate runs, each of which may install a fresh dependency tree.
    timeout-minutes: 45
    # Read only, and no `GH_TOKEN` anywhere in this job. Everything after the
    # install step is untrusted code by construction.
    permissions:
      contents: read # checkout reads the ref; nothing here writes to the repo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Try each held upgrade
        run: node .github/scripts/retry-deferred.mjs

      - name: Hand the report to the reporting job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deferred-report
          path: deferred-report.md
          if-no-files-found: error
          retention-days: 7

  report:
    name: Record the findings
    needs: retry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with a credential, and the only one that runs no repository
    # or dependency code: no checkout, no install, no node. Its whole input is a
    # markdown file produced by the job above, and markdown in an issue body is
    # data rather than something this job executes.
    permissions:
      issues: write # edit, comment on or open the deferred-upgrade tracking issue
    steps:
      - name: Download the report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deferred-report

      - name: Record the findings in the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: 'Deferred major upgrades: are they adoptable yet?'
        run: |
          set -euo pipefail
          BODY="$(cat deferred-report.md)"
          # One issue, reused. A new issue every month would be a subscription to
          # noise, and the interesting thing is the latest answer rather than the
          # history of answers.
          EXISTING="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --body "$BODY"
            gh issue comment "$EXISTING" --repo "$REPO" \
              --body "Re-checked on $(date -u +%Y-%m-%d). See the issue body for the current table."
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --label dependencies
          fi
