name: PR Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # the semantic-title action reads the pull request's title

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Single source of truth: derive the allowed types/scopes from
      # commitlint.config.cjs so the PR-title gate can never drift from the
      # commit-message gate (the commit-messages job below runs the same
      # config). The runner's system Node is enough to require a CJS config, so
      # this job skips the toolchain setup entirely.
      - name: Read allowed types and scopes from commitlint config
        id: enums
        run: |
          # The single quotes around the node program are load-bearing: the
          # `${...}` sequences inside it are JavaScript template literals, and
          # the shell must hand them to node untouched. shellcheck, which
          # actionlint runs over every `run:` block, sees `${...}` inside single
          # quotes and assumes the author wanted shell expansion.
          # shellcheck disable=SC2016
          node -e '
            const c = require("./commitlint.config.cjs");
            const r = c.rules || {};
            const list = (rule) => (rule && rule[2] ? rule[2] : []).join("\n");
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `types<<EOF\n${list(r["type-enum"])}\nEOF\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `scopes<<EOF\n${list(r["scope-enum"])}\nEOF\n`);
          '

      - name: Check semantic PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ steps.enums.outputs.types }}
          scopes: ${{ steps.enums.outputs.scopes }}
          requireScope: true

  commit-messages:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only an OPEN pull request, because linting the commit messages of a merged
    # one gates nothing: those commits are in the history either way, and no
    # outcome of this job can change that. Every pull request is open when it
    # merges, so the gate still runs on everything it is able to block. That is
    # the justification, and it does not depend on the failure below.
    #
    # What made it visible: `edited` is one of this workflow's triggers, so
    # editing the title or body of an already-merged pull request re-runs this
    # job. Nine merged pull requests were edited in one pass on 2026-09-06 and
    # two of them failed. The condition is that the pull request was
    # SQUASH-merged AND its head branch was deleted - both together:
    #
    #   #148 #221                  1 parent   branch deleted   head not on dev   FAILED
    #   #297 #306 #308 #314        2 parents  branch alive     head on dev       passed
    #   #327 #332 #335             2 parents  branch alive     head on dev       passed
    #
    # A squash merge writes a new single-parent commit, so the head is reachable
    # only through `refs/pull/<n>/head` once the branch goes; a merge commit
    # keeps the head as its second parent, so the range resolves whether or not
    # the branch still exists. What THIS job's checkout fetches, read from its own
    # run logs rather than from the action's documentation:
    #
    #   open            one fetch:  +refs/heads/*  +refs/tags/*  +<sha>:refs/remotes/pull/<n>/merge
    #   closed, merged  two fetches: +refs/heads/*  +refs/tags/*
    #                                then +<sha>:refs/remotes/origin/<base>
    #
    # In the closed case that pinned `<sha>` is the pull request's own MERGE
    # COMMIT, not `base.sha`. It is mapped onto the base branch's remote ref,
    # which is why it reads as "the base commit" and why anyone debugging this
    # will look for `base.sha` in the fetch line and not find it. So `BASE_SHA`
    # resolves only because it is an ancestor reachable through `refs/heads/*` -
    # nothing pins it deliberately.
    #
    # `refs/pull/<n>/head` is fetched in neither state, and it is the one ref
    # that would resolve a squashed head. So `git rev-list` reports
    # `Invalid revision range <base>..<head>` - naming BOTH ends when only the
    # head is missing, which reads like a base-SHA problem and is not one.
    # `fetch-depth: 0` is a depth, not a ref set, and does not help.
    #
    # Scoped to this job on purpose: `pr-title` above takes the default depth and
    # makes a single `--depth=1` fetch, so a fetch line read without checking
    # which job printed it will not match the shape above. And only the merged
    # closed state was observed - a closed-but-unmerged pull request has no merge
    # commit and nobody has looked at what it pins.
    #
    # Note that fixing this closes the window: with the guard in place the job no
    # longer checks out on a closed pull request, so the closed-state refspecs
    # are not observable from this workflow any more. They were measured from
    # runs that predate the guard, and those logs expire.
    #
    # Note that the two failing pull requests were squashed in August; squash
    # merging is now disabled at the repository level, so under current policy a
    # deleted branch alone no longer reproduces this.
    #
    # Deliberately keyed on the pull request being closed rather than on whether
    # the head ref resolves, and the paragraph above is why that matters beyond
    # tidiness: a head-ref check would have been tuned to half of a condition
    # that has already stopped occurring, while still running a job that gates
    # nothing.
    #
    # Not a weakening: this job is not a required status check on either
    # ruleset, `synchronize` cannot fire on a merged pull request, and
    # `reopened` is safe because GitHub requires the branch to exist to reopen.
    #
    # Promotion PRs (dev -> main) replay already-merged dev history into main.
    # Keep title validation active, but do not re-lint historical commits in
    # that path.
    #
    # Dependabot writes long changelog and release-note lines into its commit
    # bodies, which trip config-conventional's body/footer-max-line-length and
    # fail this job on every bot PR. The PR-title gate above still runs, so the
    # conventional type(scope) contract is enforced on the squash-merge subject;
    # only the generated body lines are exempt.
    if: ${{ github.event.pull_request.state == 'open' && !(github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'dev') && github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint commit messages in PR range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
