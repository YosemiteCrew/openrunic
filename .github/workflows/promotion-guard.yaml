# Only `dev` may merge into `main`.
#
# `main` is what a clinic installs. Everything reaches it through one route:
# `dev`, which is where the full gate has already run against the integrated
# tree. A branch merged straight into `main` skips that integration entirely -
# it was green against whatever `dev` looked like when it forked, which is not
# the same statement.
#
# GitHub rulesets can require a pull request, reviews and status checks, but
# they cannot say "only this branch may be the source". So the constraint is
# expressed as a status check instead, and the `main` ruleset requires it. The
# job runs on every pull request targeting `main` and fails any whose head is
# not `dev`.
#
# It fails closed twice over. A branch cut from `main` does not carry this file,
# so the check never reports, and a required check that never reports leaves the
# pull request unmergeable. That is the correct outcome for exactly the branch
# shape this exists to refuse.
#
# The head REPOSITORY is checked as well as the head branch, and that is not
# belt-and-braces. A pull request's head ref is a branch name, and a branch name
# is unique within one repository rather than across GitHub: anyone may fork this
# repository, push a branch they have also called `dev`, and open a pull request
# from it. Reading the name alone, that request is indistinguishable from a
# promotion, so the guard would pass and the one route into `main` would have a
# second entrance - one whose contents never went through the integration gate at
# all. The name says which branch; only the repository says whose.
name: Promotion guard

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  promotion-source:
    name: Promotion source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse any source branch other than this repository's dev
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [ "$HEAD_REPO" = "$BASE_REPO" ] && [ "$HEAD_REF" = "dev" ]; then
            echo "Source is $BASE_REPO:dev. This is a promotion."
            exit 0
          fi

          # Named separately because this one looks like a promotion and is not.
          # A fork's branch may carry any name its owner likes, `dev` included,
          # and a check that read the name alone would call this a promotion.
          if [ "$HEAD_REF" = "dev" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::This pull request merges '$HEAD_REPO:dev' into main, not '$BASE_REPO:dev'."
            echo "::error::A branch name is unique within a repository, not across GitHub, so a fork"
            echo "::error::branch called dev is not this repository's integration branch and has not"
            echo "::error::been through the gate against the integrated tree."
            echo "::error::Open this against dev instead; it reaches main with the next promotion."
            exit 1
          fi

          # Named separately because the remedy differs. A bot pull request on
          # main means the Dependabot configuration drifted, not that someone
          # picked the wrong base.
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "::error::Dependabot opened this pull request against main from '$HEAD_REF'."
            echo "::error::Dependency updates belong on dev, pooled into a single pull request."
            echo "::error::Check target-branch in .github/dependabot.yml on the DEFAULT branch,"
            echo "::error::and confirm Dependabot security updates are still disabled in settings"
            echo "::error::(those ignore target-branch and always aim at the default branch)."
            exit 1
          fi

          echo "::error::This pull request merges '$HEAD_REPO:$HEAD_REF' into main. Only dev may do that."
          echo "::error::main is what a clinic installs, and dev is where the gate runs against"
          echo "::error::the integrated tree. Retarget this pull request at dev; it reaches main"
          echo "::error::with the next promotion (see RELEASING.md)."
          exit 1
