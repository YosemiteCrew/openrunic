name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  # Push runs scan only their own `before..sha` range, so a superseded run leaves
  # its commits unscanned. Give each push run its own group; PR runs scan the full
  # base..head diff and are safe to supersede.
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (OSS CLI)
        env:
          # sha256 of gitleaks_8.24.2_linux_x64.tar.gz from the release's
          # published checksums. Verified before extraction so a tampered or
          # swapped release binary fails the job instead of running as root on
          # the runner with the repository checked out.
          GITLEAKS_SHA256: fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      - name: Run Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${EVENT_BEFORE}..${HEAD_SHA}"
          else
            RANGE="$HEAD_SHA"
          fi
          echo "Scanning commit range: $RANGE"
          gitleaks git --redact --verbose --exit-code 1 --log-opts="$RANGE"

  secretlint:
    name: Detect secrets (secretlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # Defence in depth beside Gitleaks, not a duplicate of it. The two tools
      # look at different things and miss different things.
      #
      # Gitleaks scans a commit RANGE with regular expressions and entropy, so
      # it is the one that catches a credential that was committed and then
      # removed. secretlint scans the WORKING TREE with rule packages, and
      # carries @secretlint/secretlint-rule-no-dotenv: a committed .env is
      # flagged for being a .env at all, whatever it contains, which is a
      # judgement no pattern-matching scanner makes. In a repository whose
      # hardest rule is that no environment file but .env.example belongs in
      # git, that is the rule most worth having twice.
      #
      # secretlint has run on staged files in the pre-commit hook since the
      # repository was created, which means it never saw a --no-verify commit,
      # an edit made through the GitHub web UI, or a bot commit. This is the
      # check that does.
      - name: Run secretlint
        run: pnpm run check:secrets
