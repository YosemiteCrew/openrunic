# License-compliance policy for the supply-chain gate.
# .github/workflows/supply-chain.yml runs grant over the repository SBOM with
# this policy; grant denies anything not on the allow list below.
#
# The repository is pure AGPL-3.0 (LICENSE is AGPL-3.0-only, no combining
# exceptions), so the list is the project's own license family plus the
# permissive, AGPL-compatible set. Deny-by-default otherwise: additions need
# the same review as a code change - include the FSF/SPDX compatibility
# rationale in the PR. In particular, GPL/LGPL dependencies are NOT
# pre-approved here; the first one to appear should be added deliberately,
# with its one-way-compatibility argument written down.
allow:
  # The project license family.
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - AGPL-3.0
  # Permissive, AGPL-compatible.
  - MIT
  - ISC
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - 0BSD
  - BlueOak-1.0.0
  - CC0-1.0
  - CC-BY-4.0
  - Unlicense
  - Python-2.0
  # Weak copyleft, compatible per FSF; file-level obligations only.
  - MPL-2.0
  # Additions verified against the actual dependency tree (pnpm licenses list,
  # 2026-08-12). Each entry carries its compatibility rationale per the policy
  # header above.
  # Artistic-2.0: FSF-listed as GPL-compatible; via secretlint's istextorbinary
  # cluster (binaryextensions, editions, textextensions, version-range).
  - Artistic-2.0
  # CC-BY-3.0: data-only dependency (spdx-exceptions license metadata); no code
  # linked into the work.
  - CC-BY-3.0
  # LGPL-3.0-or-later: one-way compatible with AGPL-3.0 (LGPLv3 section 2 relink
  # obligations satisfied by dynamic use); via sharp's prebuilt libvips binaries
  # (@img/sharp-libvips-*), an optional native image codec not linked into our
  # source.
  - LGPL-3.0-or-later
  # MIT-0: MIT with attribution requirement removed; strictly more permissive
  # than MIT (via @csstools/color-helpers).
  - MIT-0
  # WTFPL: FSF-listed as GPL-compatible permissive; via @azu/style-format
  # (secretlint formatting dependency).
  - WTFPL
  # SPDX OR expressions surfaced verbatim by the SBOM for dual-licensed
  # packages; every branch is independently on this list.
  - (MIT OR Apache-2.0)
  - (MIT OR CC0-1.0)
  # (AFL-2.1 OR BSD-3-Clause): NOT every branch is on this list, so this entry
  # is an election rather than a pass-through. AFL-2.1 is FSF-listed as
  # GPL-incompatible; BSD-3-Clause is on the list above. Under an OR the
  # recipient chooses, and json-schema's own LICENSE file says so in as many
  # words: "As a recipient of Dojo, you may choose which license to receive this
  # code under". openrunic receives it under BSD-3-Clause. Recorded here rather
  # than as a package exception because the election is a property of the
  # licence expression and holds for anything offering the same choice.
  # Verified 2026-08-22 by reading the LICENSE file, not the package.json field.
  - (AFL-2.1 OR BSD-3-Clause)

# Left false, and NOT because the tail is untriaged. It was triaged on
# 2026-08-22: all 850 packages in the installed tree were walked and exactly one
# (`seq-queue`) has no `license` field, verified MIT by reading its LICENSE file
# and excepted below.
#
# It is false because the SBOM this gate reads does not carry licences at all.
# Flipping it to true on the PR that triaged the tail produced:
#
#   by compliance: 1190 denied, 12 allowed, 6 ignored, 1190 unlicensed
#
# That is 1190 of 1202 packages reported as "no licenses found" by syft, against
# 850 that plainly declare one on disk. So the allow list above is currently
# adjudicating twelve packages, and `require-license: true` would deny the tree.
#
# The note that used to sit here called the flip "the documented follow-up
# hardening once that tail is triaged". That was the wrong follow-up: the tail
# was never the obstacle. The real one is that syft is cataloguing this pnpm
# tree without licence metadata, and until that is fixed this flag cannot be
# turned on and the allow list is doing far less than it appears to. Tracked
# separately.
require-license: false

# Package-level exceptions. Every entry MUST carry: the verified reason, an
# owner, and a re-review date. Verified means the LICENSE file in the
# installed package was read - not the package.json field. Example:
#
# ignore-packages:
#   # package.json says "bsd" (nonstandard spelling); the LICENSE file is
#   # plain BSD-3-Clause. Owner: ankit-yc. Re-review by: YYYY-MM-DD.
#   - some-package
# Precedent, kept because the argument is right and the decision went the other
# way. Read both halves before touching this.
#
# `react-doctor` was denied here as SEE-LICENSE-IN-LICENSE. Its LICENSE file was
# read: a "Modified MIT License" that additionally requires written permission
# to use the software as AI training data, or to offer it as a paid or hosted
# service. A field-of-use restriction fails clause 6 of the Open Source
# Definition, so **the licence is not open source** and is not on the FSF
# GPL-compatible list. It cannot join an allow list whose stated basis is
# "permissive, AGPL-compatible", and it has not been added to one.
#
# Two shortcuts to avoid specifically. Allow-listing the literal string
# SEE-LICENSE-IN-LICENSE admits any package shipping any custom licence text,
# which is an allow-all wearing a specific name. Adding a package to
# ignore-packages to turn a pull request green silences a gate that is firing
# correctly.
#
# The maintainers then took the decision the paragraph above anticipates: if a
# package under a non-free licence is genuinely wanted, that is a deliberate
# licensing call, recorded with an owner and a re-review date. It is recorded
# below. The gate was not weakened to reach it - the allow list is unchanged,
# and the exception names two packages and nothing else.
ignore-packages:
  # react-doctor and its oxlint plugin. Both declare "SEE LICENSE IN LICENSE"
  # in package.json, which is not an SPDX identifier, so grant cannot classify
  # them and denies by default. That default is right; this is the deliberate
  # override, not a correction of it.
  #
  # VERIFIED by reading the LICENSE file in each installed package, not the
  # package.json field. Both carry identical text: the MIT grant verbatim, plus
  # two uses that need prior written permission.
  #
  #   1. Using the Software as training, fine-tuning or evaluation data, or as
  #      input to a pipeline for training or improving an ML model or AI system.
  #   2. Selling the Software, or offering it to third parties as a paid,
  #      hosted or managed product or service whose value derives entirely or
  #      substantially from it.
  #
  # Why the restrictions do not bite here, which is a narrower claim than "the
  # licence is fine": we run it as a dev-time analyser, we do not train on its
  # source, and we neither sell it nor host it. It is a devDependency, so it is
  # not linked into or shipped with the product - the container images and
  # published artifacts do not contain it, and no AGPL combination question
  # arises. A downstream fork inherits a non-free dev tool it can delete in one
  # line, which is a materially smaller obligation than the copyleft entries on
  # the allow list above.
  #
  # It stays a package exception rather than a licence family precisely because
  # the licence is not open source: the permission must not generalise to
  # anything else shipping the same nonstandard string.
  #
  # Owner: ankit-yc. Re-review by: 2027-02-13, or sooner if either package
  # changes its LICENSE, or if openrunic ever offers a hosted service in which
  # code analysis is a substantial part of the value.
  - react-doctor
  - oxlint-plugin-react-doctor
  #
  # `deslop-js` is react-doctor's own dependency, from the same publisher
  # (Million Software, Inc.), carrying the identical Modified MIT License text.
  # VERIFIED 2026-08-22 by reading node_modules/.pnpm/deslop-js@0.9.11/.../LICENSE.
  # It reaches the tree only through react-doctor, so it is in scope of exactly
  # the argument above and falls out the moment that dependency does.
  # Owner: ankit-yc. Re-review by: 2027-02-13, with react-doctor.
  - deslop-js

  # ---------------------------------------------------------------------------
  # The rest of this list is a different kind of entry from the block above.
  # Those are a non-free licence knowingly accepted. These are packages whose
  # licence IS acceptable and whose METADATA is not machine-readable, which the
  # gate cannot tell apart. Each was verified by reading the installed LICENSE
  # file, per the rule at the top of this section.
  # ---------------------------------------------------------------------------

  # elkjs: Eclipse Public License 2.0, and this one is a real incompatibility
  # rather than a spelling problem. EPL-2.0 is not on the FSF GPL-compatible
  # list, so elkjs code linked into this AGPL work would be a licence conflict
  # that no policy file can settle.
  #
  # It is excepted because no such combination exists. It arrives as a
  # transitive dependency of @prisma/studio-core, the dev-time database GUI.
  # Nothing under apps/ or packages/ imports it, and apps/api/Dockerfile deletes
  # `elkjs@*` by name in the prune stage, so it is not in the published image
  # and is not distributed with the product. That deletion is not an assertion
  # either: the compose smoke drill boots the pruned image against a real
  # Postgres and reads seeded rows through the Prisma client, so a future Prisma
  # release that starts needing elkjs at runtime fails the drill.
  #
  # The condition that invalidates this: elkjs appearing in the runtime image,
  # or any source file importing it. Either turns this from a dev-tool footnote
  # into a licensing decision that has to be made properly.
  # Owner: ankit-yc. Re-review by: 2027-02-22.
  - elkjs

  # @visx/vendor: package.json says "MIT and ISC", which is not valid SPDX (that
  # would be "MIT AND ISC"), so grant cannot classify it. Both halves are
  # independently on the allow list above. VERIFIED 2026-08-22 by reading the
  # installed LICENSE file, which carries the MIT grant.
  #
  # A package exception rather than allow-listing the literal string, because
  # the string is not an SPDX expression and the allow list's stated basis is
  # SPDX identifiers. Admitting the raw text would admit anything that happens
  # to spell a combination the same wrong way.
  #
  # Also dev-time only: it reaches the tree through @prisma/studio-core, which
  # the Dockerfile prune removes.
  # Owner: ankit-yc. Re-review by: 2027-02-22.
  - '@visx/vendor'

  # seq-queue: no `license` field in package.json at all, which is the single
  # package that kept `require-license` off. VERIFIED 2026-08-22 by reading the
  # installed LICENSE file: "(The MIT License)", Copyright (c) 2012 Netease,
  # Inc. and other pomelo contributors. MIT is on the allow list; only the
  # metadata is missing.
  #
  # It arrives via mysql2 under the `prisma` CLI, which is a devDependency and
  # is deleted from the published image by the same prune stage.
  # Owner: ankit-yc. Re-review by: 2027-02-22, or sooner if the package
  # publishes a release that declares its licence, at which point this entry
  # should simply be deleted.
  - seq-queue
