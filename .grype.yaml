# Vulnerability-scan configuration for the supply-chain gate.
# .github/workflows/supply-chain.yml runs grype over the repository SBOM with
# --fail-on critical; grype auto-discovers this file at the repo root, so a
# local run of the same command applies the same policy.
#
# EXCEPTION PROCESS - accepted findings go under `ignore:` below. Every entry
# MUST carry a comment with: the reason it is acceptable, an owner, and an
# expiry date at which it must be re-reviewed. Example:
#
# ignore:
#   # GHSA-xxxx-xxxx-xxxx in foo@1.2.3: not reachable - the vulnerable code
#   # path needs server-side rendering we never enable. Owner: ankit-yc.
#   # Re-review by: YYYY-MM-DD. (a real date here - the placeholder is
#   # deliberate so this example never trips the expiry guard)
#   - vulnerability: GHSA-xxxx-xxxx-xxxx
#     package:
#       name: foo
#       version: 1.2.3

ignore:
  # CVE-2025-60876 in busybox: busybox wget writes the URL path and query into
  # the HTTP request line without rejecting CR/LF or raw-space control bytes, so
  # a crafted URL can split the request line (request-line splitting). Accepted
  # as unreachable: both images build FROM node:22-alpine and never invoke
  # busybox wget - the healthchecks use `node -e fetch(...)` (apps/api/Dockerfile
  # lines 216-217 and apps/web/Dockerfile line 107-108) and no layer shells out
  # to wget. There is nothing to upgrade to: Alpine has shipped no fixed busybox
  # on any in-support branch, so re-resolving the pinned digest cannot clear it
  # today. The rule matches on the CVE id alone rather than the documented
  # name+version shape because the flaw spans the busybox, busybox-binsh and
  # ssl_client subpackages and the two images may pin different -rNN revisions,
  # so a version pin would silently stop matching. Owner: ankit-yc.
  # Re-review by: 2026-11-18. Revisit condition: once Alpine publishes a patched
  # busybox, the fix is to bump the node:22-alpine digest in both Dockerfiles
  # and delete this entry.
  - vulnerability: CVE-2025-60876
