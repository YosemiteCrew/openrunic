sonar.projectKey=yosemitecrew_openrunic_Api
sonar.organization=yosemitecrew
sonar.projectName=openrunic Api

sonar.sources=src
sonar.test.inclusions=**/*.test.ts,**/__tests__/**

# Coverage path is relative to projectBaseDir (this directory); CI rewrites the
# merged lcov SF: prefixes to match and verifies resolution before scanning.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts
# src/index.ts is entry wiring, excluded from coverage in vitest config too.
sonar.coverage.exclusions=**/*.test.ts,**/__tests__/**,src/index.ts
# `src/auth/static-resolver.ts` holds DEMO_PRINCIPALS: development fixtures, one
# Principal record per demo token, every entry the same shape as the one above
# it. The detector reads 36% of the file as copy-paste because repetition IS the
# format of a lookup table. The resolver logic beside it - a plain map read - is
# analysed normally, and `createApp` refuses to install it under NODE_ENV
# production, which is the property that actually matters here.
# Revisit: if this file grows behaviour rather than rows.
sonar.cpd.exclusions=src/auth/static-resolver.ts

sonar.typescript.tsconfigPath=./tsconfig.json

# Disable analyzers irrelevant to a TypeScript app.
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# Narrow, documented rule exclusions. Each one is a verified false positive, not
# a silenced finding: the rule is right in general and wrong for this exact case.
sonar.issue.ignore.multicriteria=fhirUri

# S5332 "use https instead" on the code-system constants in the repository
# specs. These strings are FHIR canonical system URIs, which are identifiers
# rather than network endpoints: the FHIR specification defines LOINC as
# http://loinc.org and CPT as http://www.ama-assn.org/go/cpt, and nothing ever
# dereferences them. Rewriting them to https would silently break identifier
# equality against every conformant system we exchange data with.
sonar.issue.ignore.multicriteria.fhirUri.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.fhirUri.resourceKey=src/repositories/specs/*.ts
