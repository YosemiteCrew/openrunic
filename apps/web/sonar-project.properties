sonar.projectKey=yosemitecrew_openrunic_Web
sonar.organization=yosemitecrew
sonar.projectName=openrunic Web

sonar.sources=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**

# Coverage path is relative to projectBaseDir (this directory); CI rewrites the
# merged lcov SF: prefixes to match and verifies resolution before scanning.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/*.d.ts
# The mock data modules are fixtures, not logic: rows of patients, coverages,
# claims and audit events that exist to give the screens something to render
# before the API serves it. Coverage over a data literal measures whether a test
# happened to read that row, which says nothing about correctness, and the
# duplication detector reads a hundred record literals of the same shape as
# copy-paste when repetition IS the format. The code that interprets them, the
# filters and mappers in src/lib/api, is analysed normally and is where a defect
# would actually live.
# Revisit: if these modules ever grow branching logic rather than rows.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,src/app/layout.tsx,src/lib/api/mock/**
#
# `src/components/shell/navigation.ts` joins them for the same reason. It is the
# rail: seven records of {label, href, icon, keywords} and nothing else. The
# detector reports 60% of the file as copied because every entry has the shape
# of the one above it, which is what a table looks like. There is no logic in it
# to share, and the only way to satisfy the detector would be to make the
# navigation harder to read than the screen it describes.
# Revisit: if this file ever gains behaviour rather than rows.
sonar.cpd.exclusions=src/lib/api/mock/**,src/components/shell/navigation.ts

sonar.typescript.tsconfigPath=./tsconfig.json

# Disable analyzers irrelevant to a TypeScript app.
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# Verified false positives. Every entry needs a rationale and a revisit
# condition; nothing is silenced because it was noisy.
#
# S1082 ("mouse events must have corresponding keyboard events") fires on the
# `role="option"` rows in the command palette and the slash-command menu. Under
# the WAI-ARIA combobox pattern the listbox options are deliberately NOT
# focusable: focus stays in the textbox, the active option is pointed at with
# aria-activedescendant, and every keyboard interaction (ArrowUp/ArrowDown to
# move, Enter to choose, Escape to dismiss) is handled on the input. Adding
# per-option key handlers would put unreachable handlers on elements that never
# receive focus, and making the options focusable would break the pattern the
# rule exists to protect. Both menus are covered by keyboard-driven tests that
# open the list by typing, walk it with the arrow keys and commit with Enter
# without ever firing a pointer event: see the "keyboard only" blocks in
# CommandPalette.test.tsx and NoteEditor.test.tsx.
#
# Not covered by the axe pass: that runs over the Storybook in packages/ui, and
# this app has no stories. The keyboard tests are the whole of the evidence
# here, which is the reason they are named rather than gestured at.
# Revisit: if either menu stops using aria-activedescendant.
#
# Scoped to the two files that implement the pattern, not to src/components/**:
# a click handler on a genuinely non-interactive element anywhere else is a real
# defect and must keep failing the gate.
#
# S6852 ("elements with the 'option' interactive role must be focusable") fires
# on the command palette, and asks for the change that would break it. Under
# aria-activedescendant the options must NOT be focusable: DOM focus stays in
# the textbox and the active option is named by id, so giving each row a
# tabindex would put the listbox rows in the tab order and leave the textbox
# unable to own the arrow keys. The rule reads the role in isolation and cannot
# see the combobox that drives it.
#
# One file here, not the two that S1082 needs. The slash-command menu builds
# the identical listbox and would earn the identical answer, but the analyser
# raises nothing on it: its rows are <li>, the palette's are <div>. Excluding a
# rule on a file that has no finding is a rule disarmed in advance, which is
# not the same thing as a false positive that was checked and recorded. If
# S6852 ever does appear on the slash menu, it gets its own entry then, with
# the finding to point at.
# Revisit: same condition as above, if either menu stops using
# aria-activedescendant.
#
# S6845 ("tabIndex should only be declared on interactive elements") fires on
# the day-view scroll container in ScheduleGrid. A scrollable region has to be
# reachable by keyboard under WCAG 2.1.1, and tabindex="0" on the container is
# the standard way to do it; the inner appointment buttons are not a substitute
# because a day can overflow while holding no appointments at all. The only
# other literal tabIndex={0} in this app sit on role="tabpanel" elements, and
# the two tab strips rove tabindex across <button role="tab">; the rule accepts
# both, so this stays scoped to the one file rather than to the rule.
# Revisit: if the scroll container gains an interactive role of its own, or if
# the rule learns the scrollable-region exception.
#
# S5332 ("use https instead") on the LOINC system constant in the API-shaped
# fixtures. This is the same finding, the same rationale and the same narrow
# scoping already recorded in apps/api/sonar-project.properties: a FHIR
# canonical system URI is an identifier, not a network endpoint. The
# specification defines LOINC as http://loinc.org, nothing dereferences it, and
# rewriting it to https would silently break identifier equality against
# apps/api and against every conformant system we exchange data with.
#
# Scoped to the one fixture file that holds the constant, not to src/lib/**: an
# http URL that really is fetched anywhere else in the data layer is a real
# finding and must keep failing the gate.
# Revisit: if the fixtures stop mirroring the API's stored code systems, or if
# the rule learns to recognise canonical URIs.
#
# S7758 ("prefer String#codePointAt over String#charCodeAt") on the base64url
# decoder in lib/auth/seal.ts. The accessor there is deliberate and the comment
# beside it gives the argument: `atob` returns a binary string whose every
# character is one UTF-16 code unit in 0-255, and the loop wants that unit as a
# byte. The two calls agree on all 256 values `atob` can produce and differ only
# above 0xFFFF - which is precisely where one byte per index is already wrong,
# since such a code point spans two indices and truncates to zero in a
# Uint8Array slot. These bytes are the signature `crypto.subtle.verify` checks.
# `codePointAt` is also typed `number | undefined`, so taking the rule's advice
# adds a `?? 0` branch no input can reach, which is the same unreachable-branch
# problem already recorded against safeReturnPath in lib/auth/routes.ts.
# Revisit: if this decoder ever handles text rather than `atob` output.
#
# S6819 ("use <img alt=...> instead of the img role") on the marketing Lockup.
# The mark is a CSS mask on a <span>, and the comment above it explains why a
# native <img> cannot serve: the SVG strokes in `currentColor`, which inside an
# <img> resolves against the image's own document, so the same file that reads
# espresso on one band renders near-black on the other. Reaching <img> means
# committing two baked colourway builds and naming a band at every call site -
# the copy that apps/web/public/README.md deliberately keeps out of the
# repository. Logo, Glyph, Footer and SideNav in @openrunic/ui all paint the
# mark this same way, so this is the house spelling rather than a local
# shortcut. The accessibility tree is identical either way - role img, named
# "openrunic" - and the test beside the file pins exactly that.
# Revisit: if the mark stops needing currentColor, at which point <img> becomes
# available and this entry should go.
sonar.issue.ignore.multicriteria=ariaOptionPalette,ariaOptionSlash,ariaFocusPalette,scrollRegionSchedule,fhirUriFixtures,sealCodeUnits,lockupMaskRole
sonar.issue.ignore.multicriteria.ariaOptionPalette.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.ariaOptionPalette.resourceKey=src/components/command/CommandPalette.tsx
sonar.issue.ignore.multicriteria.ariaOptionSlash.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.ariaOptionSlash.resourceKey=src/components/encounter/SlashCommandMenu.tsx
sonar.issue.ignore.multicriteria.ariaFocusPalette.ruleKey=typescript:S6852
sonar.issue.ignore.multicriteria.ariaFocusPalette.resourceKey=src/components/command/CommandPalette.tsx
sonar.issue.ignore.multicriteria.scrollRegionSchedule.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.scrollRegionSchedule.resourceKey=src/components/schedule/ScheduleGrid.tsx
sonar.issue.ignore.multicriteria.fhirUriFixtures.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.fhirUriFixtures.resourceKey=src/lib/api/mock/records.ts
sonar.issue.ignore.multicriteria.sealCodeUnits.ruleKey=typescript:S7758
sonar.issue.ignore.multicriteria.sealCodeUnits.resourceKey=src/lib/auth/seal.ts
