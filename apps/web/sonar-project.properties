sonar.projectKey=yosemitecrew_openrunic_Web
sonar.organization=yosemitecrew
sonar.projectName=openrunic Web

sonar.sources=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**

# Coverage path is relative to projectBaseDir (this directory); CI rewrites the
# merged lcov SF: prefixes to match and verifies resolution before scanning.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/*.d.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,src/app/layout.tsx

sonar.typescript.tsconfigPath=./tsconfig.json

# Disable analyzers irrelevant to a TypeScript app.
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# Verified false positives. Every entry needs a rationale and a revisit
# condition; nothing is silenced because it was noisy.
#
# S1082 ("mouse events must have corresponding keyboard events") fires on the
# `role="option"` rows in the command palette and the slash-command menu. Under
# the WAI-ARIA combobox pattern the listbox options are deliberately NOT
# focusable: focus stays in the textbox, the active option is pointed at with
# aria-activedescendant, and every keyboard interaction (ArrowUp/ArrowDown to
# move, Enter to choose, Escape to dismiss) is handled on the input. Adding
# per-option key handlers would put unreachable handlers on elements that never
# receive focus, and making the options focusable would break the pattern the
# rule exists to protect. Both menus are covered by keyboard-driven tests that
# open the list by typing, walk it with the arrow keys and commit with Enter
# without ever firing a pointer event: see the "keyboard only" blocks in
# CommandPalette.test.tsx and NoteEditor.test.tsx.
#
# Not covered by the axe pass: that runs over the Storybook in packages/ui, and
# this app has no stories. The keyboard tests are the whole of the evidence
# here, which is the reason they are named rather than gestured at.
# Revisit: if either menu stops using aria-activedescendant.
#
# Scoped to the two files that implement the pattern, not to src/components/**:
# a click handler on a genuinely non-interactive element anywhere else is a real
# defect and must keep failing the gate.
#
# S6852 ("elements with the 'option' interactive role must be focusable") fires
# on the command palette, and asks for the change that would break it. Under
# aria-activedescendant the options must NOT be focusable: DOM focus stays in
# the textbox and the active option is named by id, so giving each row a
# tabindex would put the listbox rows in the tab order and leave the textbox
# unable to own the arrow keys. The rule reads the role in isolation and cannot
# see the combobox that drives it.
#
# One file here, not the two that S1082 needs. The slash-command menu builds
# the identical listbox and would earn the identical answer, but the analyser
# raises nothing on it: its rows are <li>, the palette's are <div>. Excluding a
# rule on a file that has no finding is a rule disarmed in advance, which is
# not the same thing as a false positive that was checked and recorded. If
# S6852 ever does appear on the slash menu, it gets its own entry then, with
# the finding to point at.
# Revisit: same condition as above, if either menu stops using
# aria-activedescendant.
#
# S6845 ("tabIndex should only be declared on interactive elements") fires on
# the day-view scroll container in ScheduleGrid. A scrollable region has to be
# reachable by keyboard under WCAG 2.1.1, and tabindex="0" on the container is
# the standard way to do it; the inner appointment buttons are not a substitute
# because a day can overflow while holding no appointments at all. The only
# other literal tabIndex={0} in this app sit on role="tabpanel" elements, and
# the two tab strips rove tabindex across <button role="tab">; the rule accepts
# both, so this stays scoped to the one file rather than to the rule.
# Revisit: if the scroll container gains an interactive role of its own, or if
# the rule learns the scrollable-region exception.
sonar.issue.ignore.multicriteria=ariaOptionPalette,ariaOptionSlash,ariaFocusPalette,scrollRegionSchedule
sonar.issue.ignore.multicriteria.ariaOptionPalette.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.ariaOptionPalette.resourceKey=src/components/command/CommandPalette.tsx
sonar.issue.ignore.multicriteria.ariaOptionSlash.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.ariaOptionSlash.resourceKey=src/components/encounter/SlashCommandMenu.tsx
sonar.issue.ignore.multicriteria.ariaFocusPalette.ruleKey=typescript:S6852
sonar.issue.ignore.multicriteria.ariaFocusPalette.resourceKey=src/components/command/CommandPalette.tsx
sonar.issue.ignore.multicriteria.scrollRegionSchedule.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.scrollRegionSchedule.resourceKey=src/components/schedule/ScheduleGrid.tsx
