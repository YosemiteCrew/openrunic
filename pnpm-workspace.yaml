packages:
  - apps/*
  - packages/*

# Supply-chain guard: refuse to install any package version published less
# than 3 days ago, giving the ecosystem time to catch malicious releases.
minimumReleaseAge: 4320

# Exempt from the age gate: a fresh security patch we are hand-raising to
# clear an open advisory outranks the cooldown, the same way dependabot.yml
# exempts security updates. The deepmerge-ts 8.0.x line carries the fix for
# GHSA-ggr8-5vv4-36mx.
minimumReleaseAgeExclude:
  - deepmerge-ts

# Security overrides for transitive pins we cannot update in-range. Exact
# versions on purpose - range keys silently stop matching when the parent
# changes its pin. Re-check on every Next.js major (it pins both packages).
overrides:
  # GHSA fixes: postcss < 8.5.23 (Next pins 8.4.31 exactly).
  postcss: 8.5.26
  # GHSA fix: sharp < 0.35.0 (Next optional dep allows only 0.34.x).
  sharp: 0.35.1
  # esbuild ships a prebuilt Go binary, so its embedded Go stdlib is what
  # vulnerability scanners see. 0.25.x embeds go1.23.12 (GO-2026-4337,
  # critical); 0.28.2 embeds go1.26.5. Storybook's esbuild-register pulls the
  # old line in transitively. Re-check when Storybook updates its own pin.
  esbuild: 0.28.2
  # GHSA-ggr8-5vv4-36mx: deepmerge-ts < 8.0.0 exhausts the stack on a
  # recursive object graph. Build/dev-time only - @prisma/config reads
  # prisma.config.ts and would otherwise pull the vulnerable 7.1.5; no
  # product runtime imports it. 8.0.0 is the first release past the vulnerable
  # range; 8.0.1 is the current latest of that line. Re-check when Prisma
  # updates.
  deepmerge-ts: 8.0.1
  # GHSA-3f6p-5ww8-9rcr: mysql_clear_password leaks plaintext credentials in
  # mysql2 < 3.22.0. Reached only transitively via the prisma CLI
  # devDependency; dev-time only and pruned from the published image by name in
  # apps/api/Dockerfile (removing prisma@* orphans mysql2 but does not delete
  # it). 3.24.2 is the first patched line past the release-age cooldown.
  mysql2: 3.24.2

# pnpm 10 blocks dependency postinstall scripts by default. Only these may run.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
  - sharp
  - unrs-resolver
